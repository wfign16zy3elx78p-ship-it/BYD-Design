kind = "web"
previewPath = "/"
title = "BYD Landing Page"
version = "1.0.0"
id = "artifacts/byd-landing"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19538

[services.development]
run = "pnpm --filter @workspace/byd-landing run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/byd-landing", "run", "build" ]
publicDir = "artifacts/byd-landing/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19538"
BASE_PATH = "/"
